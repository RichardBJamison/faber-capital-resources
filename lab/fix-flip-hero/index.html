<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Fix &amp; Flip hero sandbox | RECR</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #14110e; color: #f6f2ea; }
    .bar {
      position: sticky; top: 0; z-index: 20;
      display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
      padding: .75rem 1rem; background: rgba(20,17,14,.96);
      border-bottom: 1px solid rgba(196,163,90,.3);
    }
    .bar strong { font-size: .85rem; margin-right: .4rem; }
    button {
      border: 1px solid rgba(246,242,234,.3); background: transparent; color: #f6f2ea;
      padding: .4rem .75rem; border-radius: 999px; font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
    }
    button.on { background: #c4a35a; color: #1c1814; border-color: #c4a35a; }
    .bar a { margin-left: auto; color: #c4a35a; text-decoration: none; font-size: .85rem; }
    .stage {
      width: min(100%, 1100px); margin: 1rem auto; aspect-ratio: 16/9;
      background: #1c1814; border-radius: 12px; overflow: hidden; position: relative;
    }
    video { width: 100%; height: 100%; object-fit: contain; display: block; background: #1c1814; }
    .stage.cover video { object-fit: cover; }
    .meta { max-width: 1100px; margin: 0 auto 2rem; padding: 0 1rem; font-size: .9rem; line-height: 1.5; color: rgba(246,242,234,.8); }
    .meta b { color: #c4a35a; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>F&amp;F HERO LAB</strong>
    <button type="button" data-src="/assets/video/fix-and-flip-header.mp4" data-fit="contain" class="on">LIVE · full frame + slow</button>
    <button type="button" data-src="/assets/video/lab/ff-A-pad-slow.mp4" data-fit="contain">A · Full frame + slower</button>
    <button type="button" data-src="/assets/video/lab/ff-B-soft-slow.mp4" data-fit="contain">B · Soft zoom-out + slower</button>
    <button type="button" data-src="/assets/video/lab/ff-C-pad-slower.mp4" data-fit="contain">C · Full frame + slowest</button>
    <a href="/fix-and-flip/">← Fix &amp; Flip page</a>
  </div>
  <div class="stage" id="stage">
    <video id="v" muted playsinline controls autoplay></video>
  </div>
  <p class="meta">
    Goal: <b>see the roof</b> (not pan-locked on siding), <b>slower</b> motion, less glitch at the join.
    A/C = full frame with side pads. B = slight zoom-out. LIVE = current production (hard crop).
  </p>
  <script>
    const v = document.getElementById("v");
    const stage = document.getElementById("stage");
    const btns = document.querySelectorAll("button[data-src]");
    function load(btn) {
      btns.forEach((b) => b.classList.toggle("on", b === btn));
      stage.classList.toggle("cover", btn.dataset.fit === "cover");
      v.src = btn.dataset.src + "?v=" + Date.now();
      v.load();
      v.play().catch(() => {});
    }
    btns.forEach((b) => b.addEventListener("click", () => load(b)));
    load(btns[0]);
  </script>
</body>
</html>
